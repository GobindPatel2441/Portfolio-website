# ===================================================================
# GOBIND PATEL PORTFOLIO — NETLIFY PRODUCTION DEPLOYMENT & SECURITY
# ===================================================================

[build]
  publish = "MyWebsite"

# -------------------------------------------------------------------
# 1. GLOBAL BASE SECURITY HEADERS
# -------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking / frame embedding
    X-Frame-Options = "SAMEORIGIN"

    # Enforce strict MIME-type sniffing prevention
    X-Content-Type-Options = "nosniff"

    # Protect referrer information on cross-origin requests
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict sensitive browser APIs / hardware capabilities
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()"

    # Legacy XSS filter protection
    X-XSS-Protection = "1; mode=block"

    # HTTP Strict Transport Security (HSTS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Robust Content Security Policy (CSP) tailored for Three.js, Vanta, EmailJS, and Google Fonts
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self'; connect-src 'self' https://api.emailjs.com https://cdn.jsdelivr.net; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"

# -------------------------------------------------------------------
# 2. HTML ENTRY POINTS (MUST REVALIDATE TO DISCOVER NEW DEPLOYS)
# -------------------------------------------------------------------
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# -------------------------------------------------------------------
# 3. PASSIVE CLEANUP SERVICE WORKER (NEVER CACHE)
# -------------------------------------------------------------------
[[headers]]
  for = "/sw.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "no-cache, no-store, must-revalidate"

# -------------------------------------------------------------------
# 4. DATA ASSETS & JSON MANIFESTS
# -------------------------------------------------------------------
[[headers]]
  for = "/data/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# -------------------------------------------------------------------
# 5. CSS STYLESHEETS (STABLE FILENAMES — REVALIDATION POLICY)
# -------------------------------------------------------------------
[[headers]]
  for = "/css/*"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# -------------------------------------------------------------------
# 6. JAVASCRIPT MODULES & SCRIPTS (STABLE FILENAMES — REVALIDATION POLICY)
# -------------------------------------------------------------------
[[headers]]
  for = "/js/*"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# -------------------------------------------------------------------
# 7. PDF ASSETS, RESUME & CERTIFICATES (UPDATE-SAFE REVALIDATION)
# -------------------------------------------------------------------
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/certificates/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=0, must-revalidate"

# -------------------------------------------------------------------
# 8. IMAGES & VISUAL MEDIA (STABLE FILENAMES — REVALIDATION POLICY)
# -------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/certificates/thumbnails/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# -------------------------------------------------------------------
# 9. AUDIO ASSETS & SOUNDTRACK (UPDATE-SAFE REVALIDATION)
# -------------------------------------------------------------------
[[headers]]
  for = "/assets/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/audio/sfx/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
