<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gobind Patel | AI & Systems Architect Portfolio</title>
  <meta http-equiv="refresh" content="0; url=MyWebsite/" />
  <link rel="canonical" href="MyWebsite/" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #08080a;
      color: #e5e5ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .redirect-card {
      padding: 2.5rem;
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 16px;
      background: rgba(18, 18, 22, 0.85);
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      max-width: 420px;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 0.75rem;
      color: #d4af37;
      letter-spacing: 0.05em;
    }
    p {
      color: #9ca3af;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    a.btn {
      display: inline-block;
      padding: 0.75rem 1.75rem;
      background: linear-gradient(135deg, #d4af37, #f3e5ab);
      color: #08080a;
      font-weight: 700;
      text-decoration: none;
      border-radius: 9999px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    a.btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(212, 175, 55, 0.4);
    }
  </style>
  <script>
    // Seamless immediate client-side redirection preserving query params & hash
    const target = "MyWebsite/" + window.location.search + window.location.hash;
    window.location.replace(target);
  </script>
</head>
<body>
  <div class="redirect-card">
    <h1>Gobind Patel • Portfolio</h1>
    <p>Navigating to the portfolio experience...</p>
    <a href="MyWebsite/" class="btn">Enter Portfolio &rarr;</a>
  </div>
</body>
</html>
