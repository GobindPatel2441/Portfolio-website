<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Dark Obsidian Metallic Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="50%" stop-color="#141722" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <!-- Champagne Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5EB" />
      <stop offset="40%" stop-color="#F7E7C4" />
      <stop offset="80%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6D4F" />
    </linearGradient>

    <!-- Circuit Trace Gold -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#F7E7C4" stop-opacity="0.3" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseBeacon {
      0%, 100% { r: 3.5px; opacity: 1; filter: drop-shadow(0 0 4px #F7E7C4); }
      50% { r: 5.5px; opacity: 0.85; filter: drop-shadow(0 0 8px #D4AF37); }
    }
    @keyframes pulseRing {
      0% { r: 4px; opacity: 0.9; stroke-width: 1.5px; }
      100% { r: 12px; opacity: 0; stroke-width: 0.5px; }
    }
    @keyframes circuitDataPulse {
      0% { stroke-dashoffset: 60; opacity: 0.3; }
      50% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    @keyframes beamSweep {
      0% { stroke-dashoffset: 320; }
      100% { stroke-dashoffset: 0; }
    }

    .chip-border-beam {
      stroke-dasharray: 60 260;
      animation: beamSweep 3.2s linear infinite;
    }
    .quantum-beacon {
      animation: pulseBeacon 1.6s ease-in-out infinite;
    }
    .quantum-ring {
      animation: pulseRing 1.6s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
    }
    .circuit-pulse {
      stroke-dasharray: 12 18;
      animation: circuitDataPulse 2s linear infinite;
    }
  </style>

  <!-- Processor Outer Terminal Pins (Unicons processor.svg style) -->
  <g stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" opacity="0.75">
    <!-- Top Pins -->
    <line x1="38" y1="10" x2="38" y2="4" />
    <line x1="50" y1="10" x2="50" y2="4" />
    <line x1="62" y1="10" x2="62" y2="4" />
    <!-- Bottom Pins -->
    <line x1="38" y1="90" x2="38" y2="96" />
    <line x1="50" y1="90" x2="50" y2="96" />
    <line x1="62" y1="90" x2="62" y2="96" />
    <!-- Left Pins -->
    <line x1="10" y1="38" x2="4" y2="38" />
    <line x1="10" y1="50" x2="4" y2="50" />
    <line x1="10" y1="62" x2="4" y2="62" />
    <!-- Right Pins -->
    <line x1="90" y1="38" x2="96" y2="38" />
    <line x1="90" y1="50" x2="96" y2="50" />
    <line x1="90" y1="62" x2="96" y2="62" />
  </g>

  <!-- Central Processor Die (Rounded Squircle) -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#bgGrad)" stroke="#8C6D4F" stroke-width="1.2" />

  <!-- Micro-Circuit Lines (Unicons circuit.svg style) -->
  <g fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.45" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Corner Circuit -->
    <path d="M18 18 H28 V28" />
    <circle cx="18" cy="18" r="1.5" fill="#D4AF37" />
    
    <!-- Top-Right Corner Circuit -->
    <path d="M82 18 H72 V28" />
    <circle cx="82" cy="18" r="1.5" fill="#D4AF37" />

    <!-- Bottom-Left Corner Circuit -->
    <path d="M18 82 H28 V72" />
    <circle cx="18" cy="82" r="1.5" fill="#D4AF37" />

    <!-- Bottom-Right Corner Circuit leading into AI Node -->
    <path d="M82 82 H74 V72 H66" class="circuit-pulse" stroke-width="1.4" opacity="0.8" />
    <circle cx="82" cy="82" r="1.5" fill="#D4AF37" />
  </g>

  <!-- Rotating Border Beam Laser Trace -->
  <rect x="10" y="10" width="80" height="80" rx="20" fill="none" stroke="#F7E7C4" stroke-width="2" class="chip-border-beam" filter="url(#goldGlow)" />

  <!-- Inner Soft Golden Core Vignette -->
  <circle cx="50" cy="50" r="32" fill="#D4AF37" opacity="0.08" filter="url(#intenseGlow)" />

  <!-- Monogram GP Typography (Architectural Monumental) -->
  <g id="monogram-text">
    <text x="44" y="58" font-family="'Bahnschrift', 'Montserrat', 'Syne', -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-1.5" text-anchor="middle" dominant-baseline="middle" fill="url(#goldGrad)" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.8))">
      GP
    </text>
  </g>

  <!-- Quantum AI Beacon Node (The "." in GP.) -->
  <g transform="translate(71, 62)">
    <!-- Radiating Expansion Wave -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="#F7E7C4" class="quantum-ring" />
    <!-- Outer Golden Glow -->
    <circle cx="0" cy="0" r="4" fill="#D4AF37" opacity="0.6" filter="url(#goldGlow)" />
    <!-- Inner High-Intensity Core -->
    <circle cx="0" cy="0" r="3.2" fill="#FFF8F0" class="quantum-beacon" />
  </g>
</svg>
